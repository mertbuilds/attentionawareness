procs:
  web:
    # https://attentionawareness.localhost
    shell: pnpm exec portless attentionawareness pnpm --filter @attentionawareness/web dev
  storybook:
    # https://storybook.attentionawareness.localhost — storybook respects --port only, so pass PORT through.
    shell: pnpm exec portless storybook.attentionawareness sh -c 'pnpm --filter @attentionawareness/ui exec storybook dev --port "$PORT" --no-open'
