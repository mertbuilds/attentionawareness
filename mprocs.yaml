procs:
  web:
    # https://keepyourattention.localhost
    shell: pnpm exec portless keepyourattention pnpm --filter @keepyourattention/web dev
  storybook:
    # https://storybook.keepyourattention.localhost — storybook respects --port only, so pass PORT through.
    shell: pnpm exec portless storybook.keepyourattention sh -c 'pnpm --filter @keepyourattention/ui exec storybook dev --port "$PORT" --no-open'
