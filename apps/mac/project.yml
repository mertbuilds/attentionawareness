name: AttentionAwareness
options:
  bundleIdPrefix: com.attentionawareness
  deploymentTarget:
    macOS: '14.0'
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: '5.10'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: NO
  configs:
    Debug:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: '-'
      DEVELOPMENT_TEAM: ''
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: 'Developer ID Application'
      DEVELOPMENT_TEAM: '3HGP3W3TLD'
      PROVISIONING_PROFILE_SPECIFIER: ''
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
      OTHER_CODE_SIGN_FLAGS: '--timestamp --options runtime'

targets:
  AttentionAwareness:
    type: application
    platform: macOS
    sources:
      - Sources
      # The bundled backup helper runs as its own process out of
      # Contents/Helpers, signed on copy like the embedded dylibs.
      - path: Vendor/bin/idevicebackup2
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Helpers
        attributes: [CodeSignOnCopy]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: Attention Awareness
        CFBundleDisplayName: Attention Awareness
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: APPL
        CFBundleIconFile: AppIcon
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: 'Copyright © 2026 Mert Duzgun'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.attentionawareness.mac
        PRODUCT_NAME: Attention Awareness
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        CODE_SIGN_ENTITLEMENTS: Sources/AttentionAwareness.entitlements
        HEADER_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Vendor/include
        SWIFT_INCLUDE_PATHS:
          - $(inherited)
          - $(SRCROOT)/Vendor/include
        LIBRARY_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/Vendor/lib
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - '@executable_path/../Frameworks'
    # Vendored by scripts/vendor.sh, linked from Vendor/lib and embedded in
    # Contents/Frameworks so nothing resolves through Homebrew at run time.
    dependencies:
      - framework: Vendor/lib/libimobiledevice-1.0.6.dylib
        embed: true
        codeSign: true
      - framework: Vendor/lib/libimobiledevice-glue-1.0.0.dylib
        embed: true
        codeSign: true
      - framework: Vendor/lib/libusbmuxd-2.0.7.dylib
        embed: true
        codeSign: true
      - framework: Vendor/lib/libplist-2.0.4.dylib
        embed: true
        codeSign: true
      - framework: Vendor/lib/libtatsu.0.dylib
        embed: true
        codeSign: true
      - framework: Vendor/lib/libssl.3.dylib
        embed: true
        codeSign: true
      - framework: Vendor/lib/libcrypto.3.dylib
        embed: true
        codeSign: true

  # The patch and backup layers are compiled into the test bundle as well as
  # into the app, so the tests need no host application, no window and no
  # libimobiledevice.
  AttentionAwarenessTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Sources/Patch
      - Sources/Backup
      # The step order is the one part of the window that needs neither
      # SwiftUI nor an iPhone, so it is tested here with the rest.
      - Sources/UI/WizardStep.swift
      - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.attentionawareness.mac.tests
        PRODUCT_NAME: AttentionAwarenessTests
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: NO

schemes:
  AttentionAwareness:
    build:
      targets:
        AttentionAwareness: all
        AttentionAwarenessTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AttentionAwarenessTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
