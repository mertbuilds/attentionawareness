pre-commit:
  parallel: false
  jobs:
    - name: oxlint
      glob: '*.{ts,tsx,js,jsx}'
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true
    - name: oxfmt
      glob: '*.{ts,tsx,js,jsx,json,jsonc,yaml,yml,md}'
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  jobs:
    - name: typecheck
      run: pnpm typecheck
