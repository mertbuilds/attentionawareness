pre-commit:
  parallel: false
  jobs:
    - name: oxlint
      glob: '*.{ts,tsx,js,jsx}'
      # oxlint ignores the Mac app, and fails when every file it is handed is ignored
      exclude:
        - 'apps/mac/**'
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true
    - name: oxfmt
      glob: '*.{ts,tsx,js,jsx,json,jsonc,yaml,yml,md}'
      # oxfmt ignores the Mac app, and fails when every file it is handed is ignored
      exclude:
        - 'apps/mac/**'
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

pre-push:
  jobs:
    - name: typecheck
      run: pnpm typecheck
