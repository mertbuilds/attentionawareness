services:
  postgres:
    image: postgres:17-alpine
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: webstarter
      POSTGRES_PASSWORD: webstarter
      POSTGRES_DB: webstarter
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U webstarter -d webstarter']
      interval: 2s
      timeout: 3s
      retries: 15
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: [full]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://webstarter:webstarter@postgres:5432/webstarter
      NODE_ENV: production
    ports:
      - '3001:3001'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  pgdata:
