name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fetch Suisse Intl from R2
        run: pnpm fonts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FONT_BUCKET: ${{ vars.FONT_BUCKET }}
      - run: pnpm --filter @attentionawareness/web build
      - name: Smoke-test the built Worker
        # Serves the build with the production preview; / and /guide must render.
        run: bash scripts/smoke-web.sh
        timeout-minutes: 5
      - name: Deploy to Cloudflare Workers
        # --prebuilt deploys the output of the build step above.
        run: pnpm --filter @attentionawareness/web exec cf deploy --prebuilt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
