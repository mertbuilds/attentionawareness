name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  web:
    # Every step is gated on CF_API_TOKEN so fresh template clones skip cleanly
    # until Cloudflare secrets are configured (secrets aren't readable in job-level if).
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: No Cloudflare secrets configured
        if: env.CF_API_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN secret not set — web deploy skipped."
      - uses: actions/checkout@v4
        if: env.CF_API_TOKEN != ''
      - uses: pnpm/action-setup@v4
        if: env.CF_API_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.CF_API_TOKEN != ''
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.CF_API_TOKEN != ''
      - name: Fetch Suisse Intl (optional)
        if: env.CF_API_TOKEN != ''
        run: pnpm fonts
        env:
          FONT_BUCKET_URL: ${{ secrets.FONT_BUCKET_URL }}
      - run: pnpm --filter @keepyourattention/web build
        if: env.CF_API_TOKEN != ''
        env:
          VITE_POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          VITE_SENTRY_DSN: ${{ vars.WEB_SENTRY_DSN }}
      - name: Deploy to Cloudflare Workers
        if: env.CF_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
      - name: Sentry sourcemaps
        if: env.CF_API_TOKEN != '' && env.SENTRY_AUTH_TOKEN != ''
        run: npx -y @sentry/cli@2 sourcemaps upload --release ${{ github.sha }} apps/web/dist
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_WEB_PROJECT }}
