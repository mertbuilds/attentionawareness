name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  web-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @keepyourattention/web build
        env:
          # Point the preview at the Dokploy api preview when it exists, else staging.
          VITE_API_URL: ${{ vars.PREVIEW_API_URL || vars.API_URL }}
      - name: Upload preview version
        id: upload
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: versions upload
      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${{ steps.upload.outputs.deployment-url }}`;
            if (!url) return;
            const marker = '<!-- web-preview -->';
            const body = `${marker}\nWeb preview: ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }

  # api previews are handled by Dokploy's native Preview Deployments feature
  # (enable per-app in the Dokploy UI; it builds the PR branch and serves it at
  # pr-<n>.<your-api-domain> via Traefik, and tears it down on PR close).
  # Nothing to do in Actions for that path.
