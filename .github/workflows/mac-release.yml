name: Mac release
run-name: "${{ github.event_name == 'push' && format('Release request: {0}', github.event.head_commit.message) || format('{0} {1}', github.ref_name, inputs.dry_run && '(dry run)' || '(REAL RELEASE)') }}"

# Builds, signs, notarizes and uploads the Mac app with apps/mac/scripts/release.sh.
# The uploads are live at once. Every secret is a secret of the environment
# mac-release, whose required reviewer approves each run. Setup and the list of
# secrets: apps/mac/README.md, "Release".
#
# A release is asked for by a push to main that raises the build number in
# apps/mac/project.yml above the published one. No tag starts a run: the job
# `tag` writes mac-v<version> after a release, as a record. There is no
# pull_request trigger, and there must never be one.

on:
  push:
    branches: [main]
    paths:
      - apps/mac/project.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: Do everything but the uploads, and keep the files as an artifact
        type: boolean
        default: true

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  # No environment and no secret. It decides whether the push asks for a
  # release, so that a change to project.yml with no newer build number never
  # asks the owner for an approval: that request is made when `release` starts.
  detect:
    name: Detect a release request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.request.outputs.version }}
      build: ${{ steps.request.outputs.build }}
      should_release: ${{ steps.request.outputs.should_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare the build number with the published one
        id: request
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::a manual run must be on main, not on $GITHUB_REF"
            exit 1
          fi
          bash apps/mac/scripts/release-request.sh

      # The run's page shows this before anyone approves.
      - name: Say what the run will do
        env:
          VERSION: ${{ steps.request.outputs.version }}
          BUILD: ${{ steps.request.outputs.build }}
          SHOULD_RELEASE: ${{ steps.request.outputs.should_release }}
          DECISION: ${{ steps.request.outputs.decision }}
        run: |
          set -euo pipefail
          what="attention awareness for Mac $VERSION (build $BUILD), commit $GITHUB_SHA"
          {
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" = "true" ]; then
              echo "### Dry run: $what"
              echo "Nothing is uploaded. The run waits for the approval of the environment mac-release."
            elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "### REAL RELEASE, started by hand: $what"
              echo "The run waits for the approval of the environment mac-release. The uploads are live at once."
            elif [ "$SHOULD_RELEASE" = "true" ]; then
              echo "### REAL RELEASE: $what"
              echo "The run waits for the approval of the environment mac-release. The uploads are live at once."
            else
              echo "### No release"
              echo "No approval is asked for."
            fi
            echo ""
            echo "$DECISION"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Release ${{ needs.detect.outputs.version }} (${{ needs.detect.outputs.build }}) ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '(dry run)' || '(REAL RELEASE)' }}
    needs: detect
    if: needs.detect.outputs.should_release == 'true' || github.event_name == 'workflow_dispatch'
    # Apple Silicon. Keep the image and the Xcode the same as in mac-ci.yml.
    runs-on: macos-26
    environment: mac-release
    # One release at a time, and a run that has started is never cancelled. A
    # dry run uploads nothing, so it has a group of its own and does not wait
    # behind a release that is waiting for its approval.
    concurrency:
      group: mac-release${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '-dry-run' || '' }}
      cancel-in-progress: false
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mac
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, for the check against origin/main below.
          fetch-depth: 0
          persist-credentials: false

      - name: Check the ref
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::a release runs on main, not on $GITHUB_REF"
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::this commit is not on main"
            exit 1
          fi

      # The job can wait a long time for its approval, and another release can
      # go out in between. Asked again here, before the long build and before
      # any key is on the runner. release.sh holds the same rule once more.
      - name: Check the build number again
        id: request
        run: |
          set -euo pipefail
          bash scripts/release-request.sh
          if [ "$DRY_RUN" != "true" ] && ! grep -qx "newer=true" "$GITHUB_OUTPUT"; then
            echo "::error::the build number in apps/mac/project.yml is not above the published one, so there is nothing to release"
            exit 1
          fi

      - name: Select Xcode 26.6
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app

      # Built from source on every run and never restored from a cache: any
      # workflow on main can write a cache, and what is built here is signed and
      # shipped. Nothing in this job reads a cache.
      - name: Build libimobiledevice
        run: bash scripts/build-libimobiledevice.sh
      - run: bash scripts/vendor.sh

      # The release binary of the version the project is generated with on the
      # owner's Mac, checked against its sha256. Homebrew has only the newest.
      - name: Install xcodegen 2.45.4
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" https://github.com/yonaskolb/XcodeGen/releases/download/2.45.4/xcodegen.zip
          echo "090ec29491aad50aec10631bf6e62253fed733c50f3aab0f5ffc86bc170bdbef  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Install dmgbuild
        run: |
          python3 -m venv "$RUNNER_TEMP/dmgbuild"
          "$RUNNER_TEMP/dmgbuild/bin/pip" install --quiet --require-hashes -r scripts/dmgbuild-requirements.txt
          echo "DMGBUILD=$RUNNER_TEMP/dmgbuild/bin/dmgbuild" >> "$GITHUB_ENV"

      - run: xcodegen generate
      # The tests run before any key is on the runner. A Debug build signs ad hoc.
      - name: Test
        run: xcodebuild test -project AttentionAwareness.xcodeproj -scheme AttentionAwareness -destination 'platform=macOS,arch=arm64'

      # A dry run uploads nothing, so it is never handed the bucket's key pair.
      - name: Check that every secret is set
        env:
          MAC_DEVELOPER_ID_P12_BASE64: ${{ secrets.MAC_DEVELOPER_ID_P12_BASE64 }}
          MAC_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_P12_PASSWORD }}
          MAC_NOTARY_API_KEY_P8_BASE64: ${{ secrets.MAC_NOTARY_API_KEY_P8_BASE64 }}
          MAC_NOTARY_API_KEY_ID: ${{ secrets.MAC_NOTARY_API_KEY_ID }}
          MAC_NOTARY_API_ISSUER_ID: ${{ secrets.MAC_NOTARY_API_ISSUER_ID }}
          MAC_SPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.MAC_SPARKLE_ED25519_PRIVATE_KEY }}
          MAC_R2_S3_ACCESS_KEY_ID: ${{ env.DRY_RUN != 'true' && secrets.MAC_R2_S3_ACCESS_KEY_ID || '' }}
          MAC_R2_S3_SECRET_ACCESS_KEY: ${{ env.DRY_RUN != 'true' && secrets.MAC_R2_S3_SECRET_ACCESS_KEY || '' }}
          MAC_CLOUDFLARE_ACCOUNT_ID: ${{ env.DRY_RUN != 'true' && secrets.MAC_CLOUDFLARE_ACCOUNT_ID || '' }}
          MAC_R2_BUCKET: ${{ vars.MAC_R2_BUCKET }}
        run: |
          missing=0
          names="MAC_DEVELOPER_ID_P12_BASE64 MAC_DEVELOPER_ID_P12_PASSWORD
            MAC_NOTARY_API_KEY_P8_BASE64 MAC_NOTARY_API_KEY_ID MAC_NOTARY_API_ISSUER_ID
            MAC_SPARKLE_ED25519_PRIVATE_KEY MAC_R2_BUCKET"
          if [ "$DRY_RUN" != "true" ]; then
            names="$names MAC_R2_S3_ACCESS_KEY_ID MAC_R2_S3_SECRET_ACCESS_KEY MAC_CLOUDFLARE_ACCOUNT_ID"
          fi
          for name in $names; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in the environment mac-release"
              missing=1
            fi
          done
          exit "$missing"

      - name: Import the Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.MAC_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/mac-release.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          P12="$RUNNER_TEMP/developer-id.p12"
          umask 077
          printf '%s' "$P12_BASE64" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -P "$P12_PASSWORD" -f pkcs12 -k "$KEYCHAIN" \
            -T /usr/bin/codesign -T /usr/bin/security > /dev/null
          rm -f "$P12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application"; then
            echo "::error::the keychain holds no valid Developer ID Application identity"
            exit 1
          fi
          echo "NOTARY_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Store the notary credentials
        env:
          P8_BASE64: ${{ secrets.MAC_NOTARY_API_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.MAC_NOTARY_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.MAC_NOTARY_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          P8="$RUNNER_TEMP/notary-key.p8"
          umask 077
          printf '%s' "$P8_BASE64" | base64 --decode > "$P8"
          xcrun notarytool store-credentials attentionawareness-notary \
            --key "$P8" --key-id "$KEY_ID" --issuer "$ISSUER_ID" \
            --keychain "$NOTARY_KEYCHAIN"
          rm -f "$P8"

      - name: Write the Sparkle key
        env:
          SPARKLE_KEY: ${{ secrets.MAC_SPARKLE_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_FILE="$RUNNER_TEMP/sparkle-ed25519.key"
          umask 077
          printf '%s\n' "$SPARKLE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          echo "SPARKLE_ED_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"

      # No key pair for the bucket here: without one, release.sh reads the
      # published appcast from the site, and a dry run uploads nothing.
      - name: Release (dry run)
        if: env.DRY_RUN == 'true'
        env:
          R2_BUCKET: ${{ vars.MAC_R2_BUCKET }}
        run: bash scripts/release.sh --dry-run

      # release.sh reaches the bucket through its S3 endpoint with curl, and
      # tests the key pair against the bucket before it builds.
      - name: Release
        if: env.DRY_RUN != 'true'
        env:
          R2_S3_ACCESS_KEY_ID: ${{ secrets.MAC_R2_S3_ACCESS_KEY_ID }}
          R2_S3_SECRET_ACCESS_KEY: ${{ secrets.MAC_R2_S3_SECRET_ACCESS_KEY }}
          R2_S3_ENDPOINT: https://${{ secrets.MAC_CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ vars.MAC_R2_BUCKET }}
        run: bash scripts/release.sh

      - name: Keep the dry run's files
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac-release-dry-run
          path: |
            apps/mac/build/release/site/*.dmg
            apps/mac/build/release/site/appcast.xml
            apps/mac/build/release/site/latest.json
          if-no-files-found: error
          retention-days: 7

      - name: Remove the keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/mac-release.keychain-db" 2> /dev/null || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/sparkle-ed25519.key"

  # The tag is a record of what was released, written after the fact. It starts
  # no workflow: a tag pushed with the built-in token never does. This job
  # checks out nothing and runs no code from the repo.
  tag:
    name: Tag mac-v${{ needs.detect.outputs.version }}
    needs: [detect, release]
    if: needs.release.result == 'success' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Write the tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect.outputs.version }}
          BUILD: ${{ needs.detect.outputs.build }}
        run: |
          set -euo pipefail
          tag="mac-v$VERSION"
          repo="repos/$GITHUB_REPOSITORY"
          if ref=$(gh api "$repo/git/ref/tags/$tag" 2> "$RUNNER_TEMP/ref-error"); then
            sha=$(printf '%s' "$ref" | jq -r '.object.sha')
            if [ "$(printf '%s' "$ref" | jq -r '.object.type')" = "tag" ]; then
              sha=$(gh api "$repo/git/tags/$sha" --jq '.object.sha')
            fi
            if [ "$sha" = "$GITHUB_SHA" ]; then
              echo "::notice::the tag $tag is already on this commit, so it was left as it is"
            else
              echo "::warning::the tag $tag is already there, on $sha and not on the released commit $GITHUB_SHA. It was left as it is"
            fi
            exit 0
          fi
          if ! grep -q "HTTP 404" "$RUNNER_TEMP/ref-error"; then
            cat "$RUNNER_TEMP/ref-error" >&2
            echo "::error::could not ask whether the tag $tag is there. The release is live; only the tag is missing"
            exit 1
          fi
          object=$(gh api "$repo/git/tags" -f tag="$tag" -f type=commit -f object="$GITHUB_SHA" \
            -f message="attention awareness for Mac $VERSION (build $BUILD)" --jq '.sha')
          if ! gh api "$repo/git/refs" -f ref="refs/tags/$tag" -f sha="$object" --silent; then
            echo "::error::could not write the tag $tag. The release is live; only the tag is missing. The tag ruleset on mac-v* must not restrict creation: apps/mac/README.md, \"Release\""
            exit 1
          fi
          echo "::notice::wrote the tag $tag on $GITHUB_SHA"
