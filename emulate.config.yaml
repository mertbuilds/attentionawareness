# Seed data for emulate.dev local emulators (`pnpm emulate`).
# Ports follow --service order in the root `emulate` script, base 5100 (kept out of
# portless's 4000-4999 PORT pool): stripe :5100, google :5101, resend :5102.
#
# Note: emulate's Stripe emulator currently supports checkout + payment
# events only (checkout.session.completed|expired). customer.subscription.*
# events are NOT emitted — use `pnpm stripe:listen` (Stripe CLI, test mode)
# when you need the full subscription webhook flow locally. See AGENTS.md.
stripe:
  products:
    - name: Pro Plan
  prices:
    - id: price_pro_monthly_local
      product_name: Pro Plan
      unit_amount: 2000
      currency: usd
  webhooks:
    - url: http://localhost:3001/api/auth/stripe/webhook
      secret: whsec_local_emulate
      events:
        - checkout.session.completed
        - checkout.session.expired
